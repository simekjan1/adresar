<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <title>Adresář</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a0b;
      --surface: #141619;
      --surface-2: #1d2024;
      --text: #f1f2f3;
      --muted: #aeb3b9;
      --accent: #a9bdf5;
      --border: #41464d;
      --max: 52rem;
    }

    * { box-sizing: border-box; }

    html { font-size: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button, input, textarea, select { font: inherit; }

    button, .button-link {
      min-height: 3rem;
      padding: .65rem .9rem;
      border: 1px solid var(--border);
      border-radius: .5rem;
      background: var(--surface-2);
      color: var(--text);
      font-weight: 650;
      cursor: pointer;
    }

    button:hover, .button-link:hover { border-color: var(--accent); }
    button:disabled { opacity: .55; cursor: not-allowed; }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    a { color: var(--accent); }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .7rem max(1rem, env(safe-area-inset-left));
      background: #101113;
      border-bottom: 1px solid var(--border);
    }

    .app-header h1 { margin: 0; font-size: 1.25rem; }
    .menu-button { min-width: 3rem; padding-inline: .8rem; }

    main {
      width: min(100%, var(--max));
      margin: 0 auto;
      padding: 1rem 1rem 6rem;
    }

    h2, h3 { line-height: 1.25; }
    h2 { margin: .4rem 0 1rem; font-size: 1.4rem; }
    h3 { margin: 1.25rem 0 .65rem; font-size: 1.12rem; }
    p { max-width: 70ch; }

    .stack { display: grid; gap: 1rem; }
    .compact-stack { display: grid; gap: .6rem; }
    .row { display: flex; flex-wrap: wrap; gap: .7rem; align-items: center; }
    .spread { justify-content: space-between; }
    .grow { flex: 1 1 12rem; }
    .muted { color: var(--muted); }
    .danger, .success { color: var(--text); }
    .pre-wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
    .hidden { display: none !important; }

    label, legend { font-weight: 650; }

    input[type="text"], input[type="tel"], input[type="email"], input[type="search"], textarea {
      width: 100%;
      min-height: 3rem;
      margin-top: .35rem;
      padding: .65rem .75rem;
      border: 1px solid var(--border);
      border-radius: .45rem;
      background: #0d0f11;
      color: var(--text);
    }

    textarea { min-height: 8rem; resize: vertical; }
    input::placeholder, textarea::placeholder { color: #92989f; opacity: 1; }

    .search-box {
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: .6rem;
      background: var(--surface);
    }

    .search-box input { font-size: 1rem; }

    .card-list { display: grid; gap: .75rem; margin: 0; padding: 0; list-style: none; }

    .card {
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: .6rem;
      background: var(--surface);
    }

    .card > :first-child { margin-top: 0; }
    .card > :last-child { margin-bottom: 0; }

    .card-button {
      width: 100%;
      text-align: left;
      background: var(--surface);
      padding: 1rem;
    }

    .card-title { display: block; font-size: 1.05rem; }
    .card-meta { display: block; margin-top: .25rem; color: var(--muted); font-weight: 500; }

    .primary { background: #292d33; border-color: var(--accent); }
    .secondary { background: var(--surface-2); }
    .danger-button { background: #181a1d; border-color: #858b93; }
    .quiet-button { background: transparent; }

    .back-button { margin-bottom: 1rem; }

    .floating-add {
      position: fixed;
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(1rem, env(safe-area-inset-bottom));
      z-index: 8;
      border-color: var(--accent);
      background: #292d33;
    }

    fieldset {
      margin: 0;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: .6rem;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      min-height: 3rem;
    }

    .check-row input { width: 1.75rem; height: 1.75rem; flex: 0 0 auto; }
    .check-row label { display: flex; align-items: center; min-height: 3rem; flex: 1; }

    .repeat-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .6rem;
      align-items: end;
    }

    .repeat-row button { min-width: 3.2rem; }

    .detail-fields { display: grid; gap: 1rem; }
    .detail-item { margin: 0; overflow-wrap: anywhere; }
    .detail-label { display: block; margin: 0 0 .2rem; color: var(--muted); font-weight: 650; }
    .detail-value { display: block; }
    .detail-item ul { margin: .2rem 0 0; padding-left: 1.3rem; }

    dialog {
      width: min(calc(100% - 2rem), 32rem);
      max-height: calc(100vh - 2rem);
      overflow: auto;
      padding: 1.2rem;
      border: 2px solid var(--accent);
      border-radius: .6rem;
      background: var(--surface);
      color: var(--text);
    }

    dialog::backdrop { background: #000c; }
    dialog h2 { margin-top: 0; }
    .dialog-actions { display: grid; gap: .7rem; margin: 1.2rem 0 0; padding: 0; }
    .dialog-actions button { width: 100%; text-align: left; }

    .status {
      position: fixed;
      left: 50%;
      bottom: max(1rem, env(safe-area-inset-bottom));
      z-index: 30;
      width: min(calc(100% - 2rem), 36rem);
      transform: translateX(-50%);
      padding: .9rem 1rem;
      border: 1px solid var(--accent);
      border-radius: .5rem;
      background: var(--surface-2);
      color: var(--text);
    }

    .file-input { padding: .7rem; border: 1px solid var(--border); border-radius: .45rem; width: 100%; }
    .warning { padding: 1rem; border-left: .3rem solid var(--accent); background: var(--surface-2); }

    @media (min-width: 42rem) {
      main { padding-inline: 1.4rem; }
      .dialog-actions.horizontal { display: flex; flex-wrap: wrap; }
      .dialog-actions.horizontal button { width: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>Adresář</h1>
    <button id="menuButton" class="menu-button" type="button" aria-haspopup="dialog" aria-controls="mainMenu">Menu</button>
  </header>

  <main id="app" tabindex="-1"></main>
  <button id="addContactButton" class="floating-add hidden" type="button">Přidat kontakt</button>

  <dialog id="mainMenu" aria-labelledby="menuTitle">
    <h2 id="menuTitle">Hlavní menu</h2>
    <nav class="dialog-actions" aria-label="Položky hlavního menu">
      <button type="button" data-view="groups">Správa skupin</button>
      <button type="button" data-view="transfer">Import</button>
      <button type="button" data-view="transfer">Export a zálohy</button>
      <button type="button" data-view="trash">Koš</button>
      <button type="button" data-view="help">Návod</button>
      <button id="closeMenuButton" class="quiet-button" type="button">Zavřít menu</button>
    </nav>
  </dialog>

  <dialog id="confirmDialog" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
    <h2 id="confirmTitle">Potvrzení</h2>
    <p id="confirmMessage"></p>
    <div class="dialog-actions horizontal">
      <button id="confirmYes" type="button">Potvrdit</button>
      <button id="confirmNo" class="quiet-button" type="button">Zrušit</button>
    </div>
  </dialog>

  <dialog id="choiceDialog" aria-labelledby="choiceTitle" aria-describedby="choiceMessage">
    <h2 id="choiceTitle">Vyberte možnost</h2>
    <p id="choiceMessage"></p>
    <div id="choiceButtons" class="dialog-actions"></div>
  </dialog>

  <dialog id="promptDialog" aria-labelledby="promptTitle">
    <form id="promptForm" method="dialog" class="stack">
      <h2 id="promptTitle">Zadejte hodnotu</h2>
      <label for="promptInput">Název</label>
      <input id="promptInput" type="text" autocomplete="off">
      <p id="promptError" class="danger" role="alert"></p>
      <div class="row">
        <button id="promptSave" class="primary" type="submit" value="save">Uložit</button>
        <button type="submit" value="cancel">Zrušit</button>
      </div>
    </form>
  </dialog>

  <div id="status" class="status hidden" role="status" aria-live="polite" aria-atomic="true"></div>

  <input id="jsonFileInput" class="hidden" type="file" accept="application/json,.json">
  <input id="vcfFileInput" class="hidden" type="file" accept="text/vcard,text/x-vcard,.vcf">

  <script>
  (() => {
    'use strict';

    const DB_NAME = 'adresar-offline-db';
    const DB_VERSION = 1;
    const APP_ID = 'cz.local.adresar';
    const FORMAT_VERSION = 1;
    const IMPORTED_ID = 'system-imported';

    const app = document.getElementById('app');
    const menuButton = document.getElementById('menuButton');
    const mainMenu = document.getElementById('mainMenu');
    const closeMenuButton = document.getElementById('closeMenuButton');
    const addContactButton = document.getElementById('addContactButton');
    const statusBox = document.getElementById('status');
    const jsonFileInput = document.getElementById('jsonFileInput');
    const vcfFileInput = document.getElementById('vcfFileInput');

    let database;
    let statusTimer;
    const state = {
      contacts: [],
      groups: [],
      view: 'home',
      groupId: null,
      detailId: null,
      editId: null,
      formDirty: false,
      formReturn: { view: 'home' },
      detailReturn: { view: 'home' },
      pendingJsonMode: 'merge'
    };

    function makeId(prefix) {
      if (globalThis.crypto && typeof crypto.randomUUID === 'function') return prefix + '-' + crypto.randomUUID();
      return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains('contacts')) db.createObjectStore('contacts', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('groups')) db.createObjectStore('groups', { keyPath: 'id' });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        request.onblocked = () => reject(new Error('Databázi blokuje jiné otevřené okno aplikace.'));
      });
    }

    function storeRequest(storeName, mode, operation) {
      return new Promise((resolve, reject) => {
        const tx = database.transaction(storeName, mode);
        const store = tx.objectStore(storeName);
        let result;
        try { result = operation(store); } catch (error) { reject(error); return; }
        tx.oncomplete = () => resolve(result && 'result' in result ? result.result : result);
        tx.onerror = () => reject(tx.error || new Error('Operace s databází se nezdařila.'));
        tx.onabort = () => reject(tx.error || new Error('Operace s databází byla přerušena.'));
      });
    }

    const getAll = storeName => storeRequest(storeName, 'readonly', store => store.getAll());
    const putOne = (storeName, value) => storeRequest(storeName, 'readwrite', store => store.put(value));
    const deleteOne = (storeName, key) => storeRequest(storeName, 'readwrite', store => store.delete(key));

    function replaceDatabase(groups, contacts) {
      return new Promise((resolve, reject) => {
        const tx = database.transaction(['groups', 'contacts'], 'readwrite');
        const groupStore = tx.objectStore('groups');
        const contactStore = tx.objectStore('contacts');
        groupStore.clear();
        contactStore.clear();
        groups.forEach(group => groupStore.put(group));
        contacts.forEach(contact => contactStore.put(contact));
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error || new Error('Obnova databáze se nezdařila.'));
        tx.onabort = () => reject(tx.error || new Error('Obnova databáze byla přerušena.'));
      });
    }

    async function reloadData() {
      [state.contacts, state.groups] = await Promise.all([getAll('contacts'), getAll('groups')]);
      state.groups.sort((a, b) => compareText(a.name, b.name));
    }

    function el(tag, attributes, ...children) {
      const node = document.createElement(tag);
      if (attributes) {
        for (const [key, value] of Object.entries(attributes)) {
          if (key === 'className') node.className = value;
          else if (key === 'text') node.textContent = value;
          else if (key.startsWith('on') && typeof value === 'function') node.addEventListener(key.slice(2).toLowerCase(), value);
          else if (key === 'checked') node.checked = Boolean(value);
          else if (key === 'value') node.value = value;
          else if (value !== false && value != null) node.setAttribute(key, value === true ? '' : String(value));
        }
      }
      for (const child of children.flat()) {
        if (child == null) continue;
        node.append(child.nodeType ? child : document.createTextNode(String(child)));
      }
      return node;
    }

    function heading(text) { return el('h2', { text }); }
    function button(text, onClick, className = '') {
      return el('button', { type: 'button', className, onClick, text });
    }

    function normalizeText(value) {
      return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('cs').trim();
    }

    function normalizePhone(value) {
      const source = String(value || '').trim();
      return (source.startsWith('+') ? '+' : '') + source.replace(/\D/g, '');
    }

    function compareText(a, b) {
      return String(a || '').localeCompare(String(b || ''), 'cs', { sensitivity: 'base' });
    }

    function activeContacts() { return state.contacts.filter(contact => !contact.deletedAt); }
    function deletedContacts() { return state.contacts.filter(contact => Boolean(contact.deletedAt)); }

    function displayName(contact) {
      const first = String(contact.firstName || '').trim();
      const last = String(contact.lastName || '').trim();
      if (first && last) return first + ' ' + last;
      if (first) return first;
      if (last) return last;
      if (contact.phones && contact.phones[0]) return contact.phones[0];
      if (contact.emails && contact.emails[0]) return contact.emails[0];
      return 'Kontakt bez názvu';
    }

    function sortContacts(contacts) {
      return [...contacts].sort((a, b) => {
        const last = compareText(a.lastName, b.lastName);
        if (last) return last;
        const first = compareText(a.firstName, b.firstName);
        if (first) return first;
        return compareText(displayName(a), displayName(b));
      });
    }

    function groupName(id) {
      if (id === IMPORTED_ID) return 'Importované';
      const group = state.groups.find(item => item.id === id);
      return group ? group.name : '';
    }

    function contactMatches(contact, query) {
      const needle = normalizeText(query);
      if (!needle) return true;
      const textValues = [contact.firstName, contact.lastName, contact.note, ...(contact.emails || []), ...(contact.groupIds || []).map(groupName)];
      if (textValues.some(value => normalizeText(value).includes(needle))) return true;
      const phoneNeedle = normalizePhone(query);
      return phoneNeedle.length >= 2 && (contact.phones || []).some(phone => normalizePhone(phone).includes(phoneNeedle));
    }

    function hasImportedContacts() {
      return activeContacts().some(contact => (contact.groupIds || []).includes(IMPORTED_ID));
    }

    function groupContacts(id) {
      const contacts = activeContacts();
      if (id === 'all') return contacts;
      return contacts.filter(contact => (contact.groupIds || []).includes(id));
    }

    function announce(message, kind = 'normal') {
      clearTimeout(statusTimer);
      statusBox.textContent = message;
      statusBox.classList.remove('hidden', 'danger', 'success');
      if (kind !== 'normal') statusBox.classList.add(kind);
      statusTimer = setTimeout(() => statusBox.classList.add('hidden'), 6000);
    }

    function backButton(target = { view: 'home' }, label = 'Zpět') {
      return button(label, () => navigate(target.view, target), 'back-button quiet-button');
    }

    function focusMain() {
      requestAnimationFrame(() => {
        const target = state.view === 'form'
          ? document.getElementById('firstName')
          : app;
        if (target) target.focus({ preventScroll: true });
        window.scrollTo(0, 0);
      });
    }

    function restoreDialogFocus(opener) {
      requestAnimationFrame(() => {
        if (opener && opener.isConnected && typeof opener.focus === 'function') opener.focus();
      });
    }

    async function confirmAction(title, message, confirmLabel = 'Potvrdit', danger = false) {
      const dialog = document.getElementById('confirmDialog');
      const yes = document.getElementById('confirmYes');
      const no = document.getElementById('confirmNo');
      const opener = document.activeElement;
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMessage').textContent = message;
      yes.textContent = confirmLabel;
      yes.className = danger ? 'danger-button' : 'primary';
      return new Promise(resolve => {
        let settled = false;
        const finish = result => {
          if (settled) return;
          settled = true;
          yes.removeEventListener('click', onYes);
          no.removeEventListener('click', onNo);
          dialog.removeEventListener('cancel', onCancel);
          if (dialog.open) dialog.close();
          restoreDialogFocus(opener);
          resolve(result);
        };
        const onYes = () => finish(true);
        const onNo = () => finish(false);
        const onCancel = event => { event.preventDefault(); finish(false); };
        yes.addEventListener('click', onYes);
        no.addEventListener('click', onNo);
        dialog.addEventListener('cancel', onCancel);
        dialog.showModal();
        (danger ? no : yes).focus();
      });
    }

    async function chooseAction(title, message, options) {
      const dialog = document.getElementById('choiceDialog');
      const box = document.getElementById('choiceButtons');
      const opener = document.activeElement;
      document.getElementById('choiceTitle').textContent = title;
      document.getElementById('choiceMessage').textContent = message;
      box.replaceChildren();
      return new Promise(resolve => {
        let settled = false;
        const finish = value => {
          if (settled) return;
          settled = true;
          dialog.removeEventListener('cancel', onCancel);
          if (dialog.open) dialog.close();
          restoreDialogFocus(opener);
          resolve(value);
        };
        const onCancel = event => { event.preventDefault(); finish(null); };
        options.forEach((option, index) => {
          const control = button(option.label, () => finish(option.value), option.className || (index === 0 ? 'primary' : ''));
          box.append(control);
        });
        const cancel = button('Zrušit', () => finish(null), 'quiet-button');
        box.append(cancel);
        dialog.addEventListener('cancel', onCancel);
        dialog.showModal();
        box.querySelector('button').focus();
      });
    }

    async function promptValue(title, label, initialValue = '') {
      const dialog = document.getElementById('promptDialog');
      const form = document.getElementById('promptForm');
      const input = document.getElementById('promptInput');
      const labelNode = form.querySelector('label');
      const error = document.getElementById('promptError');
      const opener = document.activeElement;
      document.getElementById('promptTitle').textContent = title;
      labelNode.textContent = label;
      input.value = initialValue;
      error.textContent = '';
      return new Promise(resolve => {
        let settled = false;
        const finish = value => {
          if (settled) return;
          settled = true;
          form.removeEventListener('submit', onSubmit);
          dialog.removeEventListener('cancel', onCancel);
          if (dialog.open) dialog.close();
          restoreDialogFocus(opener);
          resolve(value);
        };
        const onSubmit = event => {
          event.preventDefault();
          if (event.submitter && event.submitter.value === 'cancel') return finish(null);
          const value = input.value.trim();
          if (!value) { error.textContent = 'Název nesmí být prázdný.'; input.focus(); return; }
          finish(value);
        };
        const onCancel = event => { event.preventDefault(); finish(null); };
        form.addEventListener('submit', onSubmit);
        dialog.addEventListener('cancel', onCancel);
        dialog.showModal();
        input.focus();
        input.select();
      });
    }

    async function navigate(view, options = {}) {
      if (state.formDirty && view !== 'form') {
        const leave = await confirmAction('Neuložené změny', 'Ve formuláři jsou neuložené změny. Opravdu chcete odejít bez uložení?', 'Odejít bez uložení', true);
        if (!leave) return;
        state.formDirty = false;
      }
      state.view = view;
      if ('groupId' in options) state.groupId = options.groupId;
      if ('detailId' in options) state.detailId = options.detailId;
      if ('editId' in options) state.editId = options.editId;
      render();
      focusMain();
    }

    function render() {
      app.replaceChildren();
      addContactButton.classList.toggle('hidden', !['home', 'group'].includes(state.view));
      if (state.view === 'home') renderHome();
      else if (state.view === 'group') renderGroup();
      else if (state.view === 'form') renderForm();
      else if (state.view === 'detail') renderDetail();
      else if (state.view === 'groups') renderGroupManager();
      else if (state.view === 'transfer') renderTransfer();
      else if (state.view === 'trash') renderTrash();
      else if (state.view === 'help') renderHelp();
      else renderHome();
    }

    function renderHome() {
      const searchSection = el('section', { className: 'search-box stack', 'aria-labelledby': 'globalSearchHeading' });
      searchSection.append(
        el('h2', { id: 'globalSearchHeading', text: 'Hledat ve všech kontaktech' }),
        el('label', { for: 'globalSearch', text: 'Jméno, telefon, e-mail, poznámka nebo skupina' })
      );
      const search = el('input', { id: 'globalSearch', type: 'search', inputmode: 'search', autocomplete: 'off', placeholder: 'Začněte psát…' });
      const resultHeading = el('h3', { id: 'searchResultHeading', className: 'hidden', text: 'Výsledky hledání' });
      const resultStatus = el('p', { className: 'muted', role: 'status', 'aria-live': 'polite', 'aria-atomic': 'true' });
      const results = el('div');
      search.addEventListener('input', () => {
        const query = search.value;
        results.replaceChildren();
        resultHeading.classList.toggle('hidden', !query.trim());
        if (!query.trim()) { resultStatus.textContent = ''; return; }
        const matches = sortContacts(activeContacts().filter(contact => contactMatches(contact, query)));
        resultStatus.textContent = contactCountMessage(matches.length);
        results.append(renderContactList(matches, 'Hledání neodpovídá žádný kontakt.'));
      });
      searchSection.append(search, resultHeading, resultStatus, results);

      const groupsSection = el('section', { 'aria-labelledby': 'groupsHeading' }, el('h2', { id: 'groupsHeading', text: 'Skupiny' }));
      if (!activeContacts().length) groupsSection.append(el('p', { className: 'muted', text: 'Zatím tu nejsou žádné kontakty. Přidejte první kontakt tlačítkem Přidat kontakt.' }));
      const list = el('ul', { className: 'card-list' });
      list.append(groupListItem('all', 'Všechny kontakty', activeContacts().length));
      if (hasImportedContacts()) list.append(groupListItem(IMPORTED_ID, 'Importované', groupContacts(IMPORTED_ID).length));
      state.groups.forEach(group => list.append(groupListItem(group.id, group.name, groupContacts(group.id).length)));
      groupsSection.append(list);
      app.append(searchSection, groupsSection);
    }

    function groupListItem(id, name, count) {
      const control = button(name + ' – ' + count, () => navigate('group', { groupId: id }), 'card-button');
      return el('li', null, control);
    }

    function contactCard(contact) {
      const control = button('', () => {
        state.detailReturn = state.view === 'group' ? { view: 'group', groupId: state.groupId } : { view: 'home' };
        navigate('detail', { detailId: contact.id });
      }, 'card-button');
      control.setAttribute('aria-label', 'Otevřít kontakt ' + displayName(contact));
      control.append(el('span', { className: 'card-title', text: displayName(contact) }));
      const bits = [];
      if (contact.phones && contact.phones[0] && displayName(contact) !== contact.phones[0]) bits.push(contact.phones[0]);
      if (contact.emails && contact.emails[0] && displayName(contact) !== contact.emails[0]) bits.push(contact.emails[0]);
      if (bits.length) control.append(el('span', { className: 'card-meta', text: bits.join(' · ') }));
      return el('li', null, control);
    }

    function renderContactList(contacts, emptyMessage) {
      if (!contacts.length) return el('p', { className: 'muted', text: emptyMessage });
      const list = el('ul', { className: 'card-list' });
      contacts.forEach(contact => list.append(contactCard(contact)));
      return list;
    }

    function contactCountMessage(count) {
      if (count === 1) return 'Nalezen 1 kontakt.';
      if (count >= 2 && count <= 4) return 'Nalezeny ' + count + ' kontakty.';
      return 'Nalezeno ' + count + ' kontaktů.';
    }

    function renderGroup() {
      const id = state.groupId || 'all';
      const name = id === 'all' ? 'Všechny kontakty' : groupName(id);
      if (!name || (id === IMPORTED_ID && !hasImportedContacts())) {
        state.view = 'home';
        renderHome();
        return;
      }
      app.append(backButton(), heading(name));
      const searchWrap = el('div', { className: 'search-box stack' });
      const label = el('label', { for: 'groupSearch', text: 'Hledat v této skupině' });
      const search = el('input', { id: 'groupSearch', type: 'search', inputmode: 'search', autocomplete: 'off', placeholder: 'Jméno, telefon, e-mail…' });
      const resultStatus = el('p', { className: 'muted', role: 'status', 'aria-live': 'polite', 'aria-atomic': 'true' });
      const results = el('div');
      const update = () => {
        const matches = sortContacts(groupContacts(id).filter(contact => contactMatches(contact, search.value)));
        resultStatus.textContent = search.value.trim() ? contactCountMessage(matches.length) : '';
        results.replaceChildren(renderContactList(matches, search.value.trim() ? 'Hledání neodpovídá žádný kontakt.' : 'V této skupině zatím nejsou žádné kontakty.'));
      };
      search.addEventListener('input', update);
      searchWrap.append(label, search, resultStatus, results);
      app.append(searchWrap);
      update();
    }

    function openNewContact() {
      const preselected = state.view === 'group' && state.groupId !== 'all' && state.groupId !== IMPORTED_ID ? [state.groupId] : [];
      state.formReturn = state.view === 'group' ? { view: 'group', groupId: state.groupId } : { view: 'home' };
      state.editId = null;
      state.newGroupIds = preselected;
      state.view = 'form';
      state.formDirty = false;
      render();
      focusMain();
    }

    function renderForm() {
      const existing = state.editId ? state.contacts.find(contact => contact.id === state.editId && !contact.deletedAt) : null;
      if (state.editId && !existing) { navigate('home'); return; }
      const initial = existing || { firstName: '', lastName: '', phones: [''], emails: [''], note: '', groupIds: state.newGroupIds || [] };
      app.append(heading(existing ? 'Upravit kontakt' : 'Přidat kontakt'));
      const form = el('form', { id: 'contactForm', className: 'stack' });
      form.append(fieldControl('Jméno', 'firstName', 'text', initial.firstName || '', 'given-name'));
      form.append(fieldControl('Příjmení', 'lastName', 'text', initial.lastName || '', 'family-name'));

      const phoneSet = el('fieldset', null, el('legend', { text: 'Telefonní čísla' }));
      const phoneRows = el('div', { id: 'phoneRows', className: 'compact-stack' });
      (initial.phones && initial.phones.length ? initial.phones : ['']).forEach(value => addRepeatRow(phoneRows, 'tel', 'Telefon', value));
      phoneSet.append(phoneRows, button('Přidat další telefon', () => { addRepeatRow(phoneRows, 'tel', 'Telefon', '', true); state.formDirty = true; }));
      form.append(phoneSet);

      const emailRows = el('div', { id: 'emailRows', className: 'compact-stack' });
      (initial.emails && initial.emails.length ? initial.emails : ['']).forEach(value => addRepeatRow(emailRows, 'email', 'E-mail', value));
      emailSet.append(emailRows, button('Přidat další e-mail', () => { addRepeatRow(emailRows, 'email', 'E-mail', '', true); state.formDirty = true; }));
      form.append(emailSet);

      const noteLabel = el('label', { for: 'note', text: 'Poznámka' });
      const note = el('textarea', { id: 'note', name: 'note' });
      note.value = initial.note || '';
      form.append(noteLabel, note);

      const groupSet = el('fieldset', null, el('legend', { text: 'Skupiny' }));
      if (!state.groups.length) groupSet.append(el('p', { className: 'muted', text: 'Nejdříve můžete vytvořit skupiny ve Správě skupin. Kontakt lze uložit i bez skupiny.' }));
      state.groups.forEach((group, index) => {
        const inputId = 'group-checkbox-' + index;
        const labelId = inputId + '-label';
        const checkbox = el('input', { id: inputId, type: 'checkbox', name: 'groupIds', value: group.id, checked: (initial.groupIds || []).includes(group.id), 'aria-labelledby': labelId });
        groupSet.append(el('div', { className: 'check-row' }, checkbox, el('label', { id: labelId, for: inputId, text: group.name })));
      });

      const actions = el('div', { className: 'row' },

      );

      form.addEventListener('input', () => { state.formDirty = true; });
      form.addEventListener('submit', event => saveContactForm(event, existing));

    function fieldControl(labelText, id, type, value, autocomplete) {
      const wrap = el('div');
      const label = el('label', { for: id, text: labelText });
      const input = el('input', { id, name: id, type, autocomplete, value });
      wrap.append(label, input);
      return wrap;
    }

    function addRepeatRow(container, type, labelText, value, focusNew = false) {
      const index = container.children.length + 1;
      const id = container.id + '-' + makeId('field');
      const input = el('input', { id, type, inputmode: type === 'tel' ? 'tel' : 'email', autocomplete: type, value });
      const label = el('label', { for: id, text: labelText + ' ' + index });
      const remove = button('Odebrat', () => {
        if (container.children.length === 1) {
          input.value = '';
          input.focus();
        } else {
          const focusTarget = row.nextElementSibling?.querySelector('input') || row.previousElementSibling?.querySelector('input');
          row.remove();
          renumberRepeatRows(container, labelText);
          if (focusTarget) focusTarget.focus();
        }
        state.formDirty = true;
      }, 'danger-button');
      remove.setAttribute('aria-label', 'Odebrat ' + labelText.toLocaleLowerCase('cs') + ' ' + index);
      const row = el('div', { className: 'repeat-row' }, el('div', null, label, input), remove);
      container.append(row);
      if (focusNew) requestAnimationFrame(() => input.focus());
      return input;
    }

    function renumberRepeatRows(container, labelText) {
      [...container.children].forEach((row, index) => {
        const number = index + 1;
        const label = row.querySelector('label');
        const remove = row.querySelector('button');
        if (label) label.textContent = labelText + ' ' + number;
        if (remove) remove.setAttribute('aria-label', 'Odebrat ' + labelText.toLocaleLowerCase('cs') + ' ' + number);
      });
    }

    async function saveContactForm(event, existing) {
      event.preventDefault();
      const form = event.currentTarget;
      const getValues = selector => [...form.querySelectorAll(selector)].map(input => input.value.trim()).filter(Boolean);
      const selectedGroups = [...form.querySelectorAll('input[name="groupIds"]:checked')].map(input => input.value);
      let groupIds = selectedGroups;
      if (existing && selectedGroups.length === 0 && (existing.groupIds || []).includes(IMPORTED_ID)) groupIds = [IMPORTED_ID];
      if (selectedGroups.length > 0) groupIds = groupIds.filter(id => id !== IMPORTED_ID);
      const now = new Date().toISOString();
      const contact = {
        id: existing ? existing.id : makeId('contact'),
        firstName: form.elements.firstName.value.trim(),
        lastName: form.elements.lastName.value.trim(),
        phones: getValues('#phoneRows input'),
        emails: getValues('#emailRows input'),
        note: form.elements.note.value.trim(),
        groupIds,
        createdAt: existing ? existing.createdAt : now,
        updatedAt: now,
        deletedAt: null
      };
      const empty = !contact.firstName && !contact.lastName && !contact.phones.length && !contact.emails.length && !contact.note && !contact.groupIds.length;
      if (empty) {
        const proceed = await confirmAction('Prázdný kontakt', 'Kontakt neobsahuje žádné údaje. Chcete ho přesto uložit?', 'Uložit prázdný kontakt');
        if (!proceed) return;
      }
      try {
        await putOne('contacts', contact);
        await reloadData();
        state.formDirty = false;
        if (!existing) state.detailReturn = { ...state.formReturn };
        state.detailId = contact.id;
        state.view = 'detail';
        render();
        focusMain();
        announce(existing ? 'Kontakt byl upraven.' : 'Kontakt byl přidán.', 'success');
      } catch (error) { announce('Kontakt se nepodařilo uložit: ' + error.message, 'danger'); }
    }

    function renderDetail() {
      const contact = state.contacts.find(item => item.id === state.detailId && !item.deletedAt);
      if (!contact) { state.view = 'home'; renderHome(); return; }
      const returnTarget = state.detailReturn || { view: 'home' };
      app.append(backButton(returnTarget), heading(displayName(contact)));
      const card = el('article', { className: 'card', 'aria-label': 'Údaje kontaktu' });
      const details = el('div', { className: 'detail-fields' });
      addDetail(details, 'Jméno', contact.firstName);
      addDetail(details, 'Příjmení', contact.lastName);
      addDetailList(details, 'Telefonní čísla', contact.phones);
      addDetailList(details, 'E-mailové adresy', contact.emails);
      addDetail(details, 'Poznámka', contact.note, 'pre-wrap');
      const names = (contact.groupIds || []).map(groupName).filter(Boolean);
      addDetailList(details, 'Skupiny', names);
      if (!details.children.length) card.append(el('p', { className: 'muted', text: 'Tento kontakt neobsahuje žádné údaje.' }));
      else card.append(details);
      const actions = el('section', null, el('h3', { text: 'Akce' }));
      const row = el('div', { className: 'row' });
      if (contact.phones && contact.phones.length) {
        row.append(button('Zavolat', () => openContactLink('tel', contact.phones, 'Vyberte telefon pro volání')));
        row.append(button('Napsat SMS', () => openContactLink('sms', contact.phones, 'Vyberte telefon pro SMS')));
      }
      if (contact.emails && contact.emails.length) row.append(button('Napsat e-mail', () => openContactLink('mailto', contact.emails, 'Vyberte e-mailovou adresu')));
      row.append(button('Upravit kontakt', () => {
        state.formReturn = { view: 'detail', detailId: contact.id };
        state.editId = contact.id;
        state.formDirty = false;
        navigate('form', { editId: contact.id });
      }, 'primary'));
      row.append(button('Smazat kontakt', () => moveContactToTrash(contact), 'danger-button'));
      actions.append(row);
      app.append(card, actions);

    function addDetail(container, labelText, value, className = '') {
      if (!String(value || '').trim()) return;
      container.append(el('p', { className: 'detail-item' },
        el('span', { className: 'detail-label', text: labelText }),
        el('span', { className: 'detail-value ' + className, text: value })
      ));
    }

    function addDetailList(container, labelText, values) {
      if (!values || !values.length) return;
      const list = el('ul');
      values.forEach(value => list.append(el('li', { text: value })));
      container.append(el('section', { className: 'detail-item' },
        el('p', { className: 'detail-label', text: labelText }),
        list
      ));
    }

    async function openContactLink(scheme, values, title) {
      let value = values[0];
      if (values.length > 1) {
        value = await chooseAction(title, 'Kontakt obsahuje více možností.', values.map(item => ({ label: item, value: item })));
      }
      if (!value) return;
      const safeValue = scheme === 'mailto' ? value.trim() : value.replace(/[^+0-9*#,;]/g, '');
      window.location.href = scheme + ':' + encodeURI(safeValue);
    }

    async function moveContactToTrash(contact) {
      const approved = await confirmAction('Přesunout kontakt do Koše?', 'Kontakt „' + displayName(contact) + '“ bude možné později obnovit.', 'Přesunout do Koše', true);
      if (!approved) return;
      contact.deletedAt = new Date().toISOString();
      contact.updatedAt = contact.deletedAt;
      await putOne('contacts', contact);
      await reloadData();
      state.view = 'home';
      render();
      focusMain();
      announce('Kontakt byl přesunut do Koše.', 'success');
    }

    function renderGroupManager() {
      app.append(backButton(), heading('Správa skupin'));
      const intro = el('p', { className: 'muted', text: 'Skupiny „Všechny kontakty“ a „Importované“ spravuje aplikace automaticky.' });
      const create = button('Vytvořit skupinu', createGroup, 'primary');
      const list = el('ul', { className: 'card-list' });
      if (!state.groups.length) list.append(el('li', { className: 'card muted', text: 'Zatím nejsou vytvořené žádné běžné skupiny.' }));
      state.groups.forEach(group => {
        const controls = el('div', { className: 'row' },
          button('Přejmenovat', () => renameGroup(group)),
          button('Smazat', () => removeGroup(group), 'danger-button')
        );
        list.append(el('li', { className: 'card' }, el('h3', { text: group.name }), el('p', { className: 'muted', text: groupContacts(group.id).length + ' kontaktů' }), controls));
      });
      app.append(intro, create, el('h3', { text: 'Běžné skupiny' }), list);

    function invalidGroupName(name, excludeId = null) {
      const normalized = normalizeText(name);
      if (['vsechny kontakty', 'importovane'].includes(normalized)) return 'Tento název je vyhrazen pro systémovou skupinu.';
      if (state.groups.some(group => group.id !== excludeId && normalizeText(group.name) === normalized)) return 'Skupina s tímto názvem už existuje.';
      return '';
    }

    async function createGroup() {
      const name = await promptValue('Vytvořit skupinu', 'Název nové skupiny');
      if (name == null) return;
      const invalid = invalidGroupName(name);
      if (invalid) { announce(invalid, 'danger'); return; }
      await putOne('groups', { id: makeId('group'), name, createdAt: new Date().toISOString() });
      await reloadData(); render(); focusMain(); announce('Skupina byla vytvořena.', 'success');
    }

    async function renameGroup(group) {
      const name = await promptValue('Přejmenovat skupinu', 'Nový název skupiny', group.name);
      if (name == null || name === group.name) return;
      const invalid = invalidGroupName(name, group.id);
      if (invalid) { announce(invalid, 'danger'); return; }
      group.name = name;
      await putOne('groups', group);
      await reloadData(); render(); focusMain(); announce('Skupina byla přejmenována.', 'success');
    }

    async function removeGroup(group) {
      const approved = await confirmAction('Smazat skupinu?', 'Skupina „' + group.name + '“ bude smazána. Kontakty zůstanou zachované.', 'Smazat skupinu', true);
      if (!approved) return;
      await deleteOne('groups', group.id);
      const affected = state.contacts.filter(contact => (contact.groupIds || []).includes(group.id));
      for (const contact of affected) {
        contact.groupIds = contact.groupIds.filter(id => id !== group.id);
        contact.updatedAt = new Date().toISOString();
        await putOne('contacts', contact);
      }
      await reloadData(); render(); focusMain(); announce('Skupina byla smazána. Kontakty zůstaly zachované.', 'success');
    }

    function renderTransfer() {
      app.append(backButton(), heading('Import, export a zálohy'));
      const warning = el('p', { className: 'warning', text: 'JSON je jediná úplná záloha aplikace. Ukládejte ji pravidelně mimo prohlížeč.' });
      const exportCard = el('section', { className: 'card' },
        el('h3', { text: 'Export' }),
        el('p', { text: 'JSON zachová kontakty, skupiny, vazby i Koš. VCF přenese pouze běžné údaje aktivních kontaktů.' }),
        el('div', { className: 'row' },
          button('Stáhnout úplnou JSON zálohu', exportJson, 'primary'),
          button('Stáhnout kontakty jako VCF', exportVcf)
        )
      );
      const jsonCard = el('section', { className: 'card' },
        el('h3', { text: 'Import JSON zálohy' }),
        el('p', { text: 'Sloučení ponechá současná data. Obnova po potvrzení současnou databázi nahradí.' }),
        el('div', { className: 'row' },
          button('Sloučit JSON se současnými daty', () => selectJson('merge')),
          button('Obnovit databázi z JSON', () => selectJson('restore'), 'danger-button')
        )
      );
      const vcfCard = el('section', { className: 'card' },
        el('h3', { text: 'Import VCF / vCard' }),
        el('p', { text: 'Nové kontakty se zařadí do skupiny „Importované“. Případné shody podle telefonu nebo e-mailu vždy posoudíte ručně.' }),

      );

    }

    function downloadFile(content, mime, extension) {
      const stamp = new Date().toISOString().replace(/[:.]/g, '-');
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const link = el('a', { href: url, download: 'adresar-' + stamp + '.' + extension });
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function buildBackup() {
      return {
        application: APP_ID,
        formatVersion: FORMAT_VERSION,
        exportedAt: new Date().toISOString(),
        groups: state.groups.map(group => ({ ...group })),
        contacts: state.contacts.map(contact => ({ ...contact, phones: [...(contact.phones || [])], emails: [...(contact.emails || [])], groupIds: [...(contact.groupIds || [])] })),
        contactGroupLinks: state.contacts.flatMap(contact => (contact.groupIds || []).map(groupId => ({ contactId: contact.id, groupId })))
      };
    }

    function exportJson() {
      downloadFile(JSON.stringify(buildBackup(), null, 2), 'application/json;charset=utf-8', 'json');
      announce('JSON záloha byla připravena ke stažení.', 'success');
    }

    function vcfEscape(value) {
      return String(value || '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/;/g, '\\;').replace(/,/g, '\\,');
    }

    function exportVcf() {
      const lines = [];
      sortContacts(activeContacts()).forEach(contact => {
        lines.push('BEGIN:VCARD', 'VERSION:3.0');
        lines.push('N:' + vcfEscape(contact.lastName) + ';' + vcfEscape(contact.firstName) + ';;;');
        lines.push('FN:' + vcfEscape(displayName(contact)));
        (contact.phones || []).forEach(phone => lines.push('TEL:' + vcfEscape(phone)));
        (contact.emails || []).forEach(email => lines.push('EMAIL:' + vcfEscape(email)));
        if (contact.note) lines.push('NOTE:' + vcfEscape(contact.note));
        lines.push('END:VCARD');
      });
      downloadFile(lines.join('\r\n') + (lines.length ? '\r\n' : ''), 'text/vcard;charset=utf-8', 'vcf');
      announce('VCF soubor byl připraven ke stažení.', 'success');
    }

    function selectJson(mode) {
      state.pendingJsonMode = mode;
      jsonFileInput.value = '';
      jsonFileInput.click();
    }

    function validateBackup(data) {
      if (!data || typeof data !== 'object' || data.application !== APP_ID) throw new Error('Soubor není záloha aplikace Adresář.');
      if (data.formatVersion !== FORMAT_VERSION) throw new Error('Tato verze aplikace nepodporuje formát zálohy ' + data.formatVersion + '.');
      if (!Array.isArray(data.groups) || !Array.isArray(data.contacts)) throw new Error('Záloha nemá platnou strukturu.');
      const groupIds = new Set();
      const groups = data.groups.map(raw => {
        if (!raw || typeof raw.id !== 'string' || typeof raw.name !== 'string' || !raw.id || !raw.name.trim() || raw.id === IMPORTED_ID || groupIds.has(raw.id)) throw new Error('Záloha obsahuje neplatnou nebo duplicitní skupinu.');
        groupIds.add(raw.id);
        return { id: raw.id, name: raw.name.trim(), createdAt: typeof raw.createdAt === 'string' ? raw.createdAt : new Date().toISOString() };
      });
      const contactIds = new Set();
      const contacts = data.contacts.map(raw => {
        if (!raw || typeof raw.id !== 'string' || !raw.id || contactIds.has(raw.id)) throw new Error('Záloha obsahuje neplatný nebo duplicitní kontakt.');
        contactIds.add(raw.id);
        return sanitizeContact(raw, raw.id);
      });
      return { groups, contacts };
    }

    function sanitizeContact(raw, id = makeId('contact')) {
      const now = new Date().toISOString();
      return {
        id,
        firstName: typeof raw.firstName === 'string' ? raw.firstName : '',
        lastName: typeof raw.lastName === 'string' ? raw.lastName : '',
        phones: Array.isArray(raw.phones) ? raw.phones.filter(value => typeof value === 'string').map(value => value.trim()).filter(Boolean) : [],
        emails: Array.isArray(raw.emails) ? raw.emails.filter(value => typeof value === 'string').map(value => value.trim()).filter(Boolean) : [],
        note: typeof raw.note === 'string' ? raw.note : '',
        groupIds: Array.isArray(raw.groupIds) ? [...new Set(raw.groupIds.filter(value => typeof value === 'string'))] : [],
        createdAt: typeof raw.createdAt === 'string' ? raw.createdAt : now,
        updatedAt: typeof raw.updatedAt === 'string' ? raw.updatedAt : now,
        deletedAt: typeof raw.deletedAt === 'string' ? raw.deletedAt : null
      };
    }

    async function importJsonFile(file, mode) {
      try {
        const parsed = JSON.parse(await file.text());
        const incoming = validateBackup(parsed);
        if (mode === 'restore') await restoreBackup(incoming);
        else await mergeBackup(incoming);
      } catch (error) {
        announce('JSON import se nezdařil: ' + error.message, 'danger');
      }
    }

    async function restoreBackup(incoming) {
      const choice = await chooseAction(
        'Obnovit databázi ze zálohy?',
        'Současné kontakty, skupiny i Koš budou nahrazeny obsahem vybraného souboru.',
        [
          { label: 'Nejprve stáhnout současnou JSON zálohu', value: 'backup' },
          { label: 'Nahradit bez další zálohy', value: 'replace', className: 'danger-button' }
        ]
      );
      if (!choice) return;
      if (choice === 'backup') {
        exportJson();
        const proceed = await confirmAction('Pokračovat v obnově?', 'Současná záloha byla nabídnuta ke stažení. Pokračujte až po jejím bezpečném uložení.', 'Nahradit databázi', true);
        if (!proceed) return;
      }
      await replaceDatabase(incoming.groups, incoming.contacts);
      await reloadData();
      state.view = 'home'; render(); focusMain();
      announce('Databáze byla obnovena z JSON zálohy.', 'success');
    }

    async function mergeBackup(incoming) {
      const groupMap = new Map();
      for (const group of incoming.groups) {
        const sameId = state.groups.find(existing => existing.id === group.id);
        const sameName = state.groups.find(existing => normalizeText(existing.name) === normalizeText(group.name));
        if (sameId) {
          if (sameId.name === group.name) groupMap.set(group.id, sameId.id);
          else {
            const choice = await chooseAction('Konflikt ID skupiny', 'Importovaná skupina „' + group.name + '“ má stejné ID jako současná skupina „' + sameId.name + '“.', [
              { label: 'Použít současnou skupinu', value: 'existing' },
              { label: 'Přidat importovanou s novým ID', value: 'new' }
            ]);
            if (choice === 'existing') groupMap.set(group.id, sameId.id);
            else if (choice === 'new') {
              const copy = { ...group, id: makeId('group') };
              await putOne('groups', copy); state.groups.push(copy); groupMap.set(group.id, copy.id);
            }
          }
        } else if (sameName) {
          const choice = await chooseAction('Možná duplicitní skupina', 'Skupina „' + group.name + '“ už existuje pod jiným ID.', [
            { label: 'Použít existující skupinu', value: 'existing' },
            { label: 'Přidat jako samostatnou skupinu', value: 'new' }
          ]);
          if (choice === 'existing') groupMap.set(group.id, sameName.id);
          else if (choice === 'new') { await putOne('groups', group); state.groups.push(group); groupMap.set(group.id, group.id); }
        } else {
          await putOne('groups', group); state.groups.push(group); groupMap.set(group.id, group.id);
        }
      }
      let added = 0, merged = 0, skipped = 0;
      for (const original of incoming.contacts) {
        const contact = sanitizeContact(original, original.id);
        contact.groupIds = contact.groupIds.map(id => id === IMPORTED_ID ? IMPORTED_ID : groupMap.get(id)).filter(Boolean);
        const result = await importOneContact(contact, { importedFromVcf: false });
        if (result === 'added') added++;
        else if (result === 'merged' || result === 'replaced') merged++;
        else skipped++;
      }
      await reloadData(); render(); focusMain();
      announce('Sloučení JSON dokončeno: přidáno ' + added + ', sloučeno nebo nahrazeno ' + merged + ', přeskočeno ' + skipped + '.', 'success');
    }

    function findPossibleDuplicate(contact) {
      const phones = new Set((contact.phones || []).map(normalizePhone).filter(Boolean));
      const emails = new Set((contact.emails || []).map(value => normalizeText(value)).filter(Boolean));
      return state.contacts.find(existing => !existing.deletedAt && (
        (existing.phones || []).some(phone => phones.has(normalizePhone(phone))) ||
        (existing.emails || []).some(email => emails.has(normalizeText(email)))
      ));
    }

    function mergeValues(existing, incoming, includeGroups) {
      const unique = values => [...new Set(values.filter(Boolean))];
      return {
        ...existing,
        firstName: existing.firstName || incoming.firstName,
        lastName: existing.lastName || incoming.lastName,
        phones: unique([...(existing.phones || []), ...(incoming.phones || [])]),
        emails: unique([...(existing.emails || []), ...(incoming.emails || [])]),
        note: unique([existing.note, incoming.note]).join('\n\n'),
        groupIds: includeGroups ? unique([...(existing.groupIds || []), ...(incoming.groupIds || [])]) : [...(existing.groupIds || [])],
        updatedAt: new Date().toISOString()
      };
    }

    async function importOneContact(contact, options) {
      const sameId = state.contacts.find(existing => existing.id === contact.id);
      if (sameId) {
        const choice = await chooseAction('Konflikt ID kontaktu', 'Kontakt „' + displayName(contact) + '“ má stejné interní ID jako kontakt „' + displayName(sameId) + '“.', [
          { label: 'Ponechat existující a přeskočit importovaný', value: 'skip' },
          { label: 'Importovat jako nový kontakt', value: 'new' },
          { label: 'Nahradit existující kontakt', value: 'replace', className: 'danger-button' }
        ]);
        if (choice === 'new') contact.id = makeId('contact');
        else if (choice === 'replace') { await putOne('contacts', contact); state.contacts = state.contacts.map(item => item.id === contact.id ? contact : item); return 'replaced'; }
        else return 'skipped';
      }
      const duplicate = findPossibleDuplicate(contact);
      if (duplicate) {
        const choice = await chooseAction('Možná duplicita kontaktu', 'Kontakt „' + displayName(contact) + '“ má stejný telefon nebo e-mail jako „' + displayName(duplicate) + '“.', [
          { label: 'Přidat jako nový kontakt', value: 'new' },
          { label: 'Sloučit s existujícím kontaktem', value: 'merge' },
          { label: 'Přeskočit importovaný kontakt', value: 'skip' }
        ]);
        if (choice === 'merge') {
          const merged = mergeValues(duplicate, contact, !options.importedFromVcf);
          if (options.importedFromVcf) merged.groupIds = (duplicate.groupIds || []).filter(id => id !== IMPORTED_ID || (duplicate.groupIds || []).includes(IMPORTED_ID));
          await putOne('contacts', merged);
          state.contacts = state.contacts.map(item => item.id === merged.id ? merged : item);
          return 'merged';
        }
        if (choice !== 'new') return 'skipped';
      }
      await putOne('contacts', contact);
      state.contacts.push(contact);
      return 'added';
    }

    function unfoldVcard(text) {
      return text.replace(/\r\n[ \t]/g, '').replace(/\n[ \t]/g, '').split(/\r?\n/);
    }

    function vcfUnescape(value) {
      return String(value || '').replace(/\\n/gi, '\n').replace(/\\,/g, ',').replace(/\\;/g, ';').replace(/\\\\/g, '\\');
    }

    function decodeQuotedPrintable(value) {
      try {
        const bytes = [];
        const source = value.replace(/=\r?\n/g, '');
        for (let i = 0; i < source.length; i++) {
          if (source[i] === '=' && /^[0-9A-F]{2}$/i.test(source.slice(i + 1, i + 3))) { bytes.push(parseInt(source.slice(i + 1, i + 3), 16)); i += 2; }
          else bytes.push(source.charCodeAt(i));
        }
        return new TextDecoder('utf-8').decode(new Uint8Array(bytes));
      } catch (_) { return value; }
    }

    function parseVcf(text) {
      const cards = [];
      let current = null;
      for (const line of unfoldVcard(text)) {
        if (line.toUpperCase() === 'BEGIN:VCARD') { current = { firstName: '', lastName: '', fullName: '', phones: [], emails: [], note: '' }; continue; }
        if (line.toUpperCase() === 'END:VCARD') { if (current) cards.push(current); current = null; continue; }
        if (!current) continue;
        const colon = line.indexOf(':');
        if (colon < 0) continue;
        const descriptor = line.slice(0, colon);
        const key = descriptor.split(';')[0].split('.').pop().toUpperCase();
        let value = line.slice(colon + 1);
        if (/ENCODING=QUOTED-PRINTABLE/i.test(descriptor)) value = decodeQuotedPrintable(value);
        value = vcfUnescape(value);
        if (key === 'N') {
          const parts = value.split(';');
          current.lastName = vcfUnescape(parts[0] || '');
          current.firstName = vcfUnescape(parts[1] || '');
        } else if (key === 'FN') current.fullName = value;
        else if (key === 'TEL' && value.trim()) current.phones.push(value.trim());
        else if (key === 'EMAIL' && value.trim()) current.emails.push(value.trim());
        else if (key === 'NOTE') current.note = value;
      }
      return cards.map(card => {
        if (!card.firstName && !card.lastName && card.fullName) {
          const parts = card.fullName.trim().split(/\s+/);
          card.firstName = parts.shift() || '';
          card.lastName = parts.join(' ');
        }
        return card;
      });
    }

    async function importVcfFile(file) {
      try {
        const cards = parseVcf(await file.text());
        if (!cards.length) throw new Error('Soubor neobsahuje žádné rozpoznané vCard kontakty.');
        let added = 0, merged = 0, skipped = 0;
        for (const card of cards) {
          const now = new Date().toISOString();
          const contact = sanitizeContact({ ...card, groupIds: [IMPORTED_ID], createdAt: now, updatedAt: now });
          const result = await importOneContact(contact, { importedFromVcf: true });
          if (result === 'added') added++;
          else if (result === 'merged') merged++;
          else skipped++;
        }
        await reloadData(); state.view = 'home'; render(); focusMain();
        announce('VCF import dokončen: přidáno ' + added + ', sloučeno ' + merged + ', přeskočeno ' + skipped + '.', 'success');
      } catch (error) { announce('VCF import se nezdařil: ' + error.message, 'danger'); }
    }

    function renderTrash() {
      app.append(backButton(), heading('Koš'));
      const contacts = sortContacts(deletedContacts());
      if (!contacts.length) {
        app.append(el('p', { className: 'muted', text: 'Koš je prázdný.' }));
        return;
      }
      app.append(el('p', { text: 'Kontakty v Koši se nikdy nemažou automaticky.' }), button('Vysypat celý Koš', emptyTrash, 'danger-button'));
      const list = el('ul', { className: 'card-list' });
      contacts.forEach(contact => {
        const deleted = contact.deletedAt ? new Date(contact.deletedAt).toLocaleString('cs-CZ') : '';
        list.append(el('li', { className: 'card' },
          el('h3', { text: displayName(contact) }),
          el('p', { className: 'muted', text: deleted ? 'Smazáno: ' + deleted : '' }),
          el('div', { className: 'row' },
            button('Obnovit kontakt', () => restoreContact(contact), 'primary'),
            button('Definitivně smazat', () => permanentlyDelete(contact), 'danger-button')
          )
        ));
      });
      app.append(el('h3', { text: 'Smazané kontakty' }), list);
    }

    async function restoreContact(contact) {
      const validGroups = new Set(state.groups.map(group => group.id));
      validGroups.add(IMPORTED_ID);
      contact.groupIds = (contact.groupIds || []).filter(id => validGroups.has(id));
      contact.deletedAt = null;
      contact.updatedAt = new Date().toISOString();
      await putOne('contacts', contact); await reloadData(); render(); focusMain();
      announce('Kontakt byl obnoven včetně skupin, které stále existují.', 'success');
    }

    async function permanentlyDelete(contact) {
      const approved = await confirmAction('Definitivně smazat kontakt?', 'Kontakt „' + displayName(contact) + '“ už nepůjde obnovit. Tato akce je nevratná.', 'Definitivně smazat', true);
      if (!approved) return;
      await deleteOne('contacts', contact.id); await reloadData(); render(); focusMain();
      announce('Kontakt byl definitivně smazán.', 'success');
    }

    async function emptyTrash() {
      const count = deletedContacts().length;
      const approved = await confirmAction('Definitivně vysypat celý Koš?', 'Bude nevratně smazáno ' + count + ' kontaktů. Tuto akci nelze vrátit.', 'Vysypat Koš', true);
      if (!approved) return;
      for (const contact of deletedContacts()) await deleteOne('contacts', contact.id);
      await reloadData(); render(); focusMain(); announce('Koš byl definitivně vysypán.', 'success');
    }

    function renderHelp() {
      app.append(backButton(), heading('Návod'));
      const article = el('article', { className: 'stack' });
      const sections = [
        ['Přidání a úprava kontaktu', 'Tlačítkem „Přidat kontakt“ otevřete formulář. Můžete vyplnit libovolné údaje, přidat více telefonů a e-mailů a zvolit skupiny. Změny se uloží jen tlačítkem „Uložit“. Kontakt upravíte z jeho detailu.'],
        ['Skupiny', 'Skupiny vytvoříte, přejmenujete nebo smažete ve Správě skupin. Jeden kontakt může být ve více skupinách. Smazání skupiny nikdy nesmaže její kontakty. „Všechny kontakty“ je stálý pohled na celý adresář.'],
        ['Hledání', 'Globální hledání na hlavní obrazovce prohledává všechny kontakty, jejich telefony, e-maily, poznámky a názvy skupin. V otevřené skupině hledáte pouze v ní. Hledání ignoruje rozdíly v diakritice a běžné formátování telefonů.'],
        ['Volání, SMS a e-mail', 'V detailu kontaktu zvolte „Zavolat“, „Napsat SMS“ nebo „Napsat e-mail“. Adresář nic neodesílá sám; pouze předá vybraný údaj příslušné aplikaci zařízení.'],
        ['Koš', 'Smazaný kontakt se přesune do Koše a zůstane tam bez časového omezení. Můžete ho obnovit, definitivně smazat nebo po výrazném potvrzení vysypat celý Koš.'],
        ['JSON záloha a obnova', 'JSON je úplná záloha: obsahuje kontakty, skupiny, vazby i Koš. Při sloučení zůstanou současná data zachována a konflikty posoudíte ručně. Obnova současnou databázi nahradí; aplikace vám nejprve nabídne stažení bezpečnostní zálohy.'],
        ['VCF import a export', 'VCF slouží k přenosu běžných kontaktních údajů, ne jako úplná záloha. Při importu se kontrolují možné duplicity podle telefonu a e-mailu. VCF exportuje pouze aktivní kontakty, ne Koš a interní stav.'],
        ['Skupina „Importované“', 'Každý nově přidaný kontakt z VCF se objeví ve skupině „Importované“. Jakmile mu při úpravě přiřadíte jinou běžnou skupinu, z „Importovaných“ se odebere. Skupina sama zmizí, až v ní nezůstane žádný aktivní kontakt. Při sloučení se existující kontakt do této skupiny nepřidá.'],
        ['Kde jsou data uložena', 'Data zůstávají pouze v místní databázi IndexedDB tohoto prohlížeče a nesynchronizují se do cloudu ani do systémových kontaktů. Vymazání dat webu nebo prohlížeče může databázi nenávratně odstranit. Proto pravidelně stahujte úplnou JSON zálohu.']
      ];
      sections.forEach(([title, text]) => article.append(el('section', { className: 'card' }, el('h3', { text: title }), el('p', { text }))));
      app.append(article);
    }

    menuButton.addEventListener('click', () => { mainMenu.showModal(); mainMenu.querySelector('[data-view]').focus(); });
    closeMenuButton.addEventListener('click', () => mainMenu.close());
    mainMenu.addEventListener('close', () => menuButton.focus());
    mainMenu.querySelectorAll('[data-view]').forEach(control => control.addEventListener('click', () => {
      const view = control.dataset.view;
      mainMenu.close();
      navigate(view);
    }));
    addContactButton.addEventListener('click', openNewContact);
    jsonFileInput.addEventListener('change', () => { const file = jsonFileInput.files[0]; if (file) importJsonFile(file, state.pendingJsonMode); });
    vcfFileInput.addEventListener('change', () => { const file = vcfFileInput.files[0]; if (file) importVcfFile(file); });
    window.addEventListener('beforeunload', event => { if (state.formDirty) { event.preventDefault(); event.returnValue = ''; } });

    async function start() {
      if (!('indexedDB' in window)) {
        app.append(heading('Adresář nelze spustit'), el('p', { className: 'danger', text: 'Tento prohlížeč nepodporuje místní databázi IndexedDB.' }));
        menuButton.disabled = true;
        return;
      }
      try {
        database = await openDatabase();
        database.onversionchange = () => { database.close(); announce('Databáze byla změněna v jiném okně. Obnovte stránku.', 'danger'); };
        await reloadData();
        render();
      } catch (error) {
        app.replaceChildren(heading('Adresář nelze otevřít'), el('p', { className: 'danger', text: 'Místní databázi se nepodařilo otevřít: ' + error.message }));
        menuButton.disabled = true;
      }
    }

    start();
  })();
  </script>
